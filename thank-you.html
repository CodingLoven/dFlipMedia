<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Thank You | dFlip Media</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="icon" type="image/x-icon" href="img/favicondflip.png">
  
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicondflip.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicondflip.png">
  
  <link rel="apple-touch-icon" sizes="180x180" href="img/favicondflip.png">

  <!-- Main CSS -->
  <link rel="stylesheet" href="styles/thank-you.css" />
</head>

<body>

  <section class="thankyou-section">
    <span class="thankyou-diagonal top"></span>
    <span class="thankyou-diagonal bottom"></span>

    <div class="thankyou-card reveal">
      <h1>THANK YOU</h1>

      <p class="thankyou-text reveal">
        Thanks for choosing us. Your message has been received successfully.
      </p>

      <p class="thankyou-subtext">
        We'll get back to you shortly. We look forward to working with you 🙂
      </p>

      <div class="thankyou-actions reveal">
        <a href="/" class="thankyou-btn">
          Back to Home
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="#ff9800" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3" />
          </svg>
        </a>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
